name: Feature request
description: Propose a capability or design change.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Large changes to public APIs, security boundaries, release process, or governance require maintainer acceptance before implementation. See [CONTRIBUTING.md](https://github.com/karlmoriaty/Runesgalder/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who has it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Flow
        - Sandbox
        - Shared runtime
        - CLI or MCP
        - Documentation
        - Build or release
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes a public API
        - label: Changes a security boundary or policy
        - label: Requires a release or package change
        - label: Requires a new dependency
        - label: I am willing to help implement this
